name: Build Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  handheld:
    name: handheld (${{ matrix.rev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rev: [rev2]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Build
        working-directory: firmware/handheld
        run: cargo build --release --features ${{ matrix.rev }}
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      - name: Install espflash
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          cargo install espflash --version "^3" --locked
      - name: Generate flash images
        working-directory: firmware/handheld
        run: |
          mkdir -p artifacts
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-espidf/release/handheld artifacts/handheld-${{ matrix.rev }}.bin
          GEN=$(find "$HOME/.espressif/esp-idf" -name gen_esp32part.py -print -quit)
          python3 "$GEN" partitions.csv artifacts/partition-table.bin
          cp bootloader.bin artifacts/bootloader.bin
          ls -la artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: handheld-${{ matrix.rev }}
          path: firmware/handheld/artifacts/

  dfu:
    name: handheld-dfu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
      - name: Build
        working-directory: firmware/handheld-dfu
        run: cargo build --release
      - name: Install espflash
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          cargo install espflash --version "^3" --locked
      - name: Generate dfu image
        working-directory: firmware/handheld-dfu
        run: |
          mkdir -p artifacts
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/handheld-dfu artifacts/handheld-dfu.bin
          ls -la artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: handheld-dfu
          path: firmware/handheld-dfu/artifacts/
