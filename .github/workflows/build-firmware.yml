name: Build Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  handheld:
    name: handheld (${{ matrix.rev }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rev: [rev2]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Build
        working-directory: firmware/handheld
        run: |
          set -o pipefail
          cargo build --release --features ${{ matrix.rev }} 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      # Surface the first compiler errors as check annotations. Without this the
      # raw job log is only downloadable by someone with admin rights, so a failed
      # build is impossible to diagnose from outside.
      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "no build log captured"; exit 0; }
          # Prefer the first compiler errors...
          BLOCK=$(awk '/^error(\[|:)/{found=1} found{print} found && ++n>=12{exit}' "$LOG" \
            | grep -v '^[[:space:]]*$' | head -n 10)
          # ...otherwise fall back to the tail of the log (cmake/kconfig failures etc).
          if [ -z "$BLOCK" ]; then
            BLOCK=$(tail -n 10 "$LOG" | grep -v '^[[:space:]]*$')
          fi
          printf '%s\n' "$BLOCK" | while IFS= read -r line; do
            echo "::error title=build::$line"
          done
          exit 0
      - name: Install espflash
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          cargo install espflash --version "^3" --locked
      - name: Generate flash images
        working-directory: firmware/handheld
        run: |
          mkdir -p artifacts
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-espidf/release/handheld artifacts/handheld-${{ matrix.rev }}.bin
          GEN=$(find "$HOME/.espressif/esp-idf" -name gen_esp32part.py -print -quit)
          python3 "$GEN" partitions.csv artifacts/partition-table.bin
          cp bootloader.bin artifacts/bootloader.bin
          ls -la artifacts
      - name: Merge full flash image (single file for flashing)
        continue-on-error: true
        working-directory: firmware/handheld
        run: |
          set -x
          python3 -m venv "$RUNNER_TEMP/esptool-venv"
          "$RUNNER_TEMP/esptool-venv/bin/pip" install --quiet "esptool<5"
          ls -la "$RUNNER_TEMP/esptool-venv/bin"
          "$RUNNER_TEMP/esptool-venv/bin/python" -m esptool version
          # merge_bin patches the image header at offset 0, i.e. the bootloader.
          # It MUST stay `dio`, matching firmware/handheld/bootloader.bin and the
          # note in espflash.toml: flashing/edge-booting this board in QIO is the
          # known-broken path (esp-rs/espflash#657). A QIO header here makes the
          # merged image hang in the ROM stage with a TG0WDT reset loop.
          "$RUNNER_TEMP/esptool-venv/bin/python" -m esptool --chip esp32s3 merge_bin \
            -o "artifacts/handheld-${{ matrix.rev }}-full.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 artifacts/bootloader.bin \
            0x8000 artifacts/partition-table.bin \
            0x100000 "artifacts/handheld-${{ matrix.rev }}.bin"
          ls -la artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: handheld-${{ matrix.rev }}
          path: firmware/handheld/artifacts/

  dfu:
    name: handheld-dfu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
      - name: Build
        working-directory: firmware/handheld-dfu
        run: cargo build --release
      - name: Install espflash
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          cargo install espflash --version "^3" --locked
      - name: Generate dfu image
        working-directory: firmware/handheld-dfu
        run: |
          mkdir -p artifacts
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/handheld-dfu artifacts/handheld-dfu.bin
          ls -la artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: handheld-dfu
          path: firmware/handheld-dfu/artifacts/

  system-files:
    name: system files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build heatshrink
        run: |
          git clone --depth 1 https://github.com/atomicobject/heatshrink.git "$RUNNER_TEMP/heatshrink"
          make -C "$RUNNER_TEMP/heatshrink"
          "$RUNNER_TEMP/heatshrink/heatshrink" -h || true
      - name: Convert bitstreams
        run: |
          set -x
          mkdir -p out
          for n in boot gameboy gba; do
            gzip -dc "system-src/$n.bit.gz" > "$RUNNER_TEMP/$n.bit"
            H="$RUNNER_TEMP/heatshrink/heatshrink"
            "$H" -w 9 -l 6 "$RUNNER_TEMP/$n.bit" "out/$n.bit.hs" \
              || "$H" -e -w 9 -l 6 "$RUNNER_TEMP/$n.bit" "out/$n.bit.hs" \
              || "$H" -w 9 -l 6 -i "$RUNNER_TEMP/$n.bit" -o "out/$n.bit.hs" \
              || "$H" -e -w 9 -l 6 < "$RUNNER_TEMP/$n.bit" > "out/$n.bit.hs"
            ls -l "out/$n.bit.hs"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: system-files
          path: out/
